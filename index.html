<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POI Pair 数据浏览器 · all_format_v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0b0f1a;
    --bg-2: #111827;
    --card-bg: rgba(23, 30, 50, 0.55);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover: rgba(255, 255, 255, 0.12);
    --text-primary: #e6ecff;
    --text-secondary: #a8b2cf;
    --text-muted: #6a7797;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --accent-3: #f472b6;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg-0);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(1200px 800px at 10% 0%, rgba(124, 92, 255, 0.18) 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 10%, rgba(34, 211, 238, 0.12) 0%, transparent 60%),
      radial-gradient(1000px 700px at 50% 100%, rgba(244, 114, 182, 0.10) 0%, transparent 60%),
      linear-gradient(180deg, #05070d 0%, #0a0e1a 100%);
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Header */
  .header { margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
    font-size: 22px;
  }
  .brand-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* Search bar */
  .search-panel {
    margin-top: 24px;
    padding: 18px;
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    position: relative;
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search-input-wrap { flex: 1; position: relative; }
  .search-input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: var(--text-muted);
  }
  .btn {
    padding: 13px 22px;
    background: linear-gradient(135deg, var(--accent) 0%, #5b3af0 100%);
    color: white; border: none;
    border-radius: var(--radius-sm);
    font-weight: 600; font-size: 14px;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(124, 92, 255, 0.4);
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124, 92, 255, 0.55); }
  .btn:active { transform: translateY(0); }
  .btn-ghost {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary); box-shadow: none;
    border: 1px solid var(--card-border);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.10); box-shadow: none; }

  /* Suggestions */
  .suggestions {
    position: absolute;
    left: 18px; right: 18px; top: calc(100% - 12px);
    background: rgba(15, 20, 34, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    max-height: 320px;
    overflow-y: auto;
    display: none;
    z-index: 20;
  }
  .suggestions.show { display: block; }
  .suggestion-item {
    padding: 10px 14px; cursor: pointer;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px; color: var(--text-secondary);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover, .suggestion-item.active { background: rgba(124, 92, 255, 0.15); color: var(--text-primary); }
  .suggestion-item .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(124, 92, 255, 0.2); color: #c4b5fd; }
  .suggestion-hit { color: var(--accent-2); font-weight: 600; }

  .stats-row {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
    font-size: 12px; color: var(--text-muted);
  }
  .stat-pill {
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--card-border);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .stat-pill strong { color: var(--text-primary); font-weight: 600; }

  /* Result area */
  .result { margin-top: 24px; }
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px dashed var(--card-border);
    border-radius: var(--radius);
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 42px; margin-bottom: 10px; opacity: 0.6; }
  .empty-state h3 { color: var(--text-secondary); margin: 0 0 6px; font-weight: 500; }

  /* Meta bar */
  .meta-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 14px 18px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    margin-bottom: 18px;
  }
  .meta-item {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 10px; border-radius: 6px;
  }
  .meta-item .k { color: var(--text-muted); margin-right: 4px; }
  .meta-item .v { color: var(--text-primary); }
  .status-badge {
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .status-2 { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
  .status-1 { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
  .status-0 { background: rgba(160, 174, 192, 0.15); color: #a0aec0; border: 1px solid rgba(160, 174, 192, 0.3); }

  /* Comparison grid */
  .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) {
    .comparison { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--card-hover); }

  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--card-border);
  }
  .card-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .card-badge {
    padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .badge-poi { background: rgba(124, 92, 255, 0.18); color: #c4b5fd; }
  .badge-corr { background: rgba(34, 211, 238, 0.18); color: #67e8f9; }
  .badge-google { background: rgba(244, 114, 182, 0.18); color: #f9a8d4; }

  .kv-list { display: grid; gap: 10px; font-size: 13px; }
  .kv-row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; }
  .kv-k { color: var(--text-muted); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }
  .kv-v { color: var(--text-primary); word-break: break-word; }
  .kv-v .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }
  .kv-v.copyable { cursor: pointer; transition: color 0.15s; }
  .kv-v.copyable:hover { color: var(--accent-2); }

  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
    margin: 20px 0 10px;
    letter-spacing: 0.02em;
  }
  .section-title .count {
    color: var(--text-muted); font-weight: 500;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
  }
  .section-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  /* Image gallery */
  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  .gallery.wide { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .thumb {
    aspect-ratio: 1 / 1;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: zoom-in;
    transition: transform 0.15s, border-color 0.15s;
  }
  .thumb:hover { transform: scale(1.03); border-color: var(--accent); z-index: 2; }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .thumb img.loaded { opacity: 1; }
  .thumb.error { display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
  .thumb .idx {
    position: absolute; top: 4px; left: 4px;
    background: rgba(0, 0, 0, 0.6);
    color: white; font-size: 10px;
    padding: 2px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    z-index: 2;
  }
  .thumb.key::after {
    content: '★';
    position: absolute; top: 4px; right: 6px;
    color: var(--warning);
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    z-index: 2;
  }
  .no-imgs {
    padding: 18px; text-align: center;
    color: var(--text-muted); font-size: 12px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed var(--card-border);
    border-radius: 10px;
  }

  /* Shared images strip */
  .strip-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 18px;
  }
  .strip-card.same { border-color: rgba(52, 211, 153, 0.25); box-shadow: 0 0 24px rgba(52, 211, 153, 0.08); }
  .strip-card.google-same { border-color: rgba(244, 114, 182, 0.25); box-shadow: 0 0 24px rgba(244, 114, 182, 0.08); }
  .strip-card.key { border-color: rgba(251, 191, 36, 0.25); box-shadow: 0 0 24px rgba(251, 191, 36, 0.08); }

  /* Google info */
  .google-info {
    margin-top: 18px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
    cursor: zoom-out;
    padding: 24px;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 95%; max-height: 92%;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  .lightbox-close {
    position: absolute; top: 20px; right: 24px;
    color: white; font-size: 32px;
    cursor: pointer; opacity: 0.7;
    background: none; border: none;
  }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-url {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; padding: 8px 14px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 8px;
    max-width: 80%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Loading */
  .loading {
    padding: 60px 24px; text-align: center; color: var(--text-secondary);
  }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }

  /* Type string */
  .type-tag {
    display: inline-block;
    padding: 3px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: #a5b4fc;
  }

  .distance-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(34, 211, 238, 0.1);
    border: 1px solid rgba(34, 211, 238, 0.25);
    color: #67e8f9;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="brand-logo">🗺️</div>
      <div>
        <div class="brand-title">POI Pair 数据浏览器</div>
        <div class="brand-sub">all_format_v5 · wuxiao_sample_100_w_key_img_w_tt_type_plus_v4_balance_shuffled_v1</div>
      </div>
    </div>

    <div class="search-panel">
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input id="search-input" class="search-input" type="text"
                 placeholder="输入 aidp_item_id（支持前缀 / 模糊搜索）..."
                 autocomplete="off" spellcheck="false" />
          <div id="suggestions" class="suggestions"></div>
        </div>
        <button id="search-btn" class="btn">查询</button>
        <button id="random-btn" class="btn btn-ghost" title="随机跳转">🎲 随机</button>
      </div>
      <div class="stats-row">
        <span class="stat-pill">📦 <strong id="stat-total">-</strong> 条目</span>
        <span class="stat-pill">🖼️ POI 图片总数 <strong id="stat-poi-imgs">-</strong></span>
        <span class="stat-pill">🖼️ CORR POI 图片总数 <strong id="stat-corr-imgs">-</strong></span>
        <span class="stat-pill">✅ 已审核 <strong id="stat-audited">-</strong></span>
      </div>
    </div>
  </div>

  <div id="result" class="result">
    <div class="empty-state">
      <div class="icon">🔎</div>
      <h3>输入 aidp_item_id 开始查询</h3>
      <p>数据集共 <span id="ids-count">-</span> 条，支持前缀匹配、包含匹配和自动补全</p>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">×</button>
  <img id="lightbox-img" alt="" onclick="event.stopPropagation()" />
  <div id="lightbox-url" class="lightbox-url"></div>
</div>

<!-- Embedded data: keyed by aidp_item_id -->

<script>
(function () {
  'use strict';

  // ---------------- Load data from TOS ----------------
  window.DATA = {};
  window.ALL_IDS = [];
  
  async function loadData() {
    const loadingEl = document.createElement('div');
    loadingEl.className = 'loading';
    loadingEl.innerHTML = '<div class="spinner"></div><div>正在从 TOS 拉取数据 (136MB，可能需要几秒钟)...</div>';
    document.getElementById('result').innerHTML = '';
    document.getElementById('result').appendChild(loadingEl);
    
    try {
        const res = await fetch('https://poi-viz-data.tos-cn-shanghai.volces.com/data.json');
        if (!res.ok) throw new Error('HTTP status ' + res.status);
        
        window.DATA = await res.json();
        window.ALL_IDS = Object.keys(window.DATA);
        window.ALL_IDS.sort();
        
        updateStats();
        
        document.getElementById('result').innerHTML = '<div class="empty-state"><div class="icon">🔎</div><h3>输入 aidp_item_id 开始查询</h3><p>数据集共 <span id="ids-count">' + window.ALL_IDS.length.toLocaleString() + '</span> 条，支持前缀匹配、包含匹配和自动补全</p></div>';
        
        fromHash();
    } catch (e) {
        loadingEl.innerHTML = '<div style="color:var(--danger)">数据加载失败: ' + escapeHtml(e.message) + '</div>';
    }
  }

  function updateStats() {
      const DATA = window.DATA;
      const ALL_IDS = window.ALL_IDS;
  document.getElementById('stat-total').textContent = ALL_IDS.length.toLocaleString();
  const idsCountEl = document.getElementById('ids-count');
  if (idsCountEl) idsCountEl.textContent = ALL_IDS.length.toLocaleString();
  let poiImgTotal = 0, corrImgTotal = 0, audited = 0;
  for (const id of ALL_IDS) {
    const d = DATA[id];
    let poiImgs = 0;
    if (d.poi && d.poi.source_img_lists_map) {
      for (const urls of Object.values(d.poi.source_img_lists_map)) {
        if (urls) poiImgs += urls.length;
      }
    }
    poiImgTotal += poiImgs;
    
    let corrImgs = 0;
    if (d.corr_poi && d.corr_poi.source_img_lists_map) {
      for (const urls of Object.values(d.corr_poi.source_img_lists_map)) {
        if (urls) corrImgs += urls.length;
      }
    }
    corrImgTotal += corrImgs;
    
    if (d.audited_status && d.audited_status !== '0' && d.audited_status !== 0) audited++;
  }
  document.getElementById('stat-poi-imgs').textContent = poiImgTotal.toLocaleString();
  document.getElementById('stat-corr-imgs').textContent = corrImgTotal.toLocaleString();
  document.getElementById('stat-audited').textContent = audited.toLocaleString();
  } // end updateStats

  // ---------------- Search / autocomplete ----------------
  const inputEl = document.getElementById('search-input');
  const suggestEl = document.getElementById('suggestions');
  const btn = document.getElementById('search-btn');
  const randomBtn = document.getElementById('random-btn');

  let suggIndex = -1;
  let currentSuggestions = [];

  function search(q, maxN) {
    q = (q || '').trim();
    if (!q) return [];
    const results = [];
    // prefix first
    for (const id of ALL_IDS) {
      if (id.startsWith(q)) {
        results.push({ id, kind: 'prefix' });
        if (results.length >= maxN) return results;
      }
    }
    // contain
    for (const id of ALL_IDS) {
      if (!id.startsWith(q) && id.includes(q)) {
        results.push({ id, kind: 'contain' });
        if (results.length >= maxN) return results;
      }
    }
    return results;
  }

  function highlight(id, q) {
    if (!q) return id;
    const idx = id.indexOf(q);
    if (idx === -1) return id;
    return id.slice(0, idx)
      + '<span class="suggestion-hit">' + id.slice(idx, idx + q.length) + '</span>'
      + id.slice(idx + q.length);
  }

  function renderSuggestions(q) {
    const list = search(q, 30);
    currentSuggestions = list;
    if (!list.length || !q) { suggestEl.classList.remove('show'); suggestEl.innerHTML = ''; suggIndex = -1; return; }
    suggestEl.innerHTML = list.map((r, i) => {
      const d = DATA[r.id] || {};
      const poi = d.poi || {}; const name = (poi.name || '(no name)').slice(0, 40);
      return '<div class="suggestion-item" data-idx="' + i + '" data-id="' + r.id + '">'
        + '<span>' + highlight(r.id, q) + ' <span style="color:var(--text-muted);margin-left:8px;font-family:Inter,sans-serif;">' + escapeHtml(name) + '</span></span>'
        + '<span class="badge">' + (r.kind === 'prefix' ? '前缀' : '包含') + '</span>'
        + '</div>';
    }).join('');
    suggestEl.classList.add('show');
    suggIndex = -1;
    suggestEl.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => { selectId(el.dataset.id); });
    });
  }

  function selectId(id) {
    inputEl.value = id;
    suggestEl.classList.remove('show');
    renderItem(id);
    // update url hash
    if (history.replaceState) history.replaceState(null, '', '#' + encodeURIComponent(id));
  }

  inputEl.addEventListener('input', (e) => renderSuggestions(e.target.value));
  inputEl.addEventListener('focus', (e) => { if (e.target.value) renderSuggestions(e.target.value); });
  inputEl.addEventListener('blur', () => setTimeout(() => suggestEl.classList.remove('show'), 150));
  inputEl.addEventListener('keydown', (e) => {
    const items = suggestEl.querySelectorAll('.suggestion-item');
    if (e.key === 'ArrowDown' && items.length) {
      e.preventDefault(); suggIndex = Math.min(suggIndex + 1, items.length - 1);
      items.forEach(el => el.classList.remove('active'));
      items[suggIndex].classList.add('active');
      items[suggIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp' && items.length) {
      e.preventDefault(); suggIndex = Math.max(suggIndex - 1, 0);
      items.forEach(el => el.classList.remove('active'));
      items[suggIndex].classList.add('active');
      items[suggIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (suggIndex >= 0 && items[suggIndex]) selectId(items[suggIndex].dataset.id);
      else if (currentSuggestions.length) selectId(currentSuggestions[0].id);
      else doSearch();
    } else if (e.key === 'Escape') {
      suggestEl.classList.remove('show');
    }
  });
  btn.addEventListener('click', doSearch);

  function doSearch() {
    const q = inputEl.value.trim();
    if (!q) return;
    if (DATA[q]) { selectId(q); return; }
    const found = search(q, 1);
    if (found.length) selectId(found[0].id);
    else renderNotFound(q);
  }

  randomBtn.addEventListener('click', () => {
    const idx = Math.floor(Math.random() * ALL_IDS.length);
    selectId(ALL_IDS[idx]);
  });

  // ---------------- Render ----------------
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function renderNotFound(q) {
    document.getElementById('result').innerHTML =
      '<div class="empty-state"><div class="icon">🚫</div><h3>未找到匹配</h3><p>输入的 <span class="mono">' + escapeHtml(q) + '</span> 未匹配到任何 aidp_item_id</p></div>';
  }

  function statusBadge(s) {
    const cls = 'status-' + (s ?? 0);
    const label = s === '2' || s === 2 ? '已审核·通过'
                : s === '1' || s === 1 ? '待审核'
                : s === '0' || s === 0 ? '未处理'
                : '状态: ' + s;
    return '<span class="status-badge ' + cls + '">' + label + '</span>';
  }

  function metaBar(d) {
    const parts = [];
    parts.push('<span class="meta-item"><span class="k">aidp_item_id</span><span class="v mono">' + escapeHtml(d.aidp_item_id) + '</span></span>');
    if (d._pic_select_case_index !== undefined && d._pic_select_case_index !== null)
      parts.push('<span class="meta-item"><span class="k">case_index</span><span class="v mono">' + escapeHtml(d._pic_select_case_index) + '</span></span>');
    if (d.queue_name) parts.push('<span class="meta-item"><span class="k">queue</span><span class="v">' + escapeHtml(d.queue_name) + '</span></span>');
    if (d.audited_status !== undefined) parts.push(statusBadge(d.audited_status));
    if (d.distance !== undefined && d.distance !== null)
      parts.push('<span class="distance-pill">📏 distance ' + Number(d.distance).toFixed(2) + ' m</span>');
    if (d.distance_g !== undefined && d.distance_g !== null)
      parts.push('<span class="distance-pill">🌍 distance_g ' + Number(d.distance_g).toFixed(2) + ' m</span>');
    return '<div class="meta-bar">' + parts.join('') + '</div>';
  }

  function kvRow(k, v, mono) {
    if (v === undefined || v === null || v === '') return '';
    const vv = mono ? '<span class="mono">' + escapeHtml(v) + '</span>' : escapeHtml(v);
    return '<div class="kv-row"><div class="kv-k">' + escapeHtml(k) + '</div><div class="kv-v">' + vv + '</div></div>';
  }

  function typeTag(t) {
    if (!t) return '';
    return '<span class="type-tag">' + escapeHtml(t) + '</span>';
  }

  function poiCard(poi, whichLabel, badgeClass) {
    if (!poi) return '<div class="card"><div class="card-header"><div class="card-title">' + whichLabel + '</div></div><div class="no-imgs">无 POI 数据</div></div>';
    const rows = [];
    rows.push(kvRow('name', poi.name));
    rows.push(kvRow('address', poi.address));
    rows.push('<div class="kv-row"><div class="kv-k">type_str</div><div class="kv-v">' + typeTag(poi.type_str || '-') + '</div></div>');
    rows.push(kvRow('poi_id', poi.poi_id, true));
    rows.push(kvRow('tt_type_v4', poi.tt_type_v4, true));
    if (poi.latitude !== undefined && poi.longitude !== undefined)
      rows.push('<div class="kv-row"><div class="kv-k">lat / lng</div><div class="kv-v mono">' + escapeHtml(poi.latitude) + ' , ' + escapeHtml(poi.longitude) + '</div></div>');
    rows.push(kvRow('status', poi.status, true));
    rows.push(kvRow('open_status', poi.open_status, true));
    rows.push(kvRow('risk_rating', poi.risk_rating, true));
    rows.push(kvRow('hook_status', poi.hook_status, true));
    rows.push(kvRow('enabled', String(poi.enabled), true));
    rows.push(kvRow('is_exist', String(poi.is_exist), true));
    // We are hiding third_ids based on user request.
    /*
    if (poi.third_id_list && poi.third_id_list.length) {
      const lst = poi.third_id_list.map((id, i) => {
        const src = poi.third_id_source_list && poi.third_id_source_list[i];
        return '<div><span class="mono">' + escapeHtml(id) + '</span>' + (src ? ' <span style="color:var(--text-muted);font-size:11px;">(' + escapeHtml(src) + ')</span>' : '') + '</div>';
      }).join('');
      rows.push('<div class="kv-row"><div class="kv-k">third_ids</div><div class="kv-v">' + lst + '</div></div>');
    }
    */
    if (poi.img_num && Object.keys(poi.img_num).length) {
      const s = Object.entries(poi.img_num).map(([k, v]) => '<span class="type-tag" style="margin-right:4px;">' + escapeHtml(k) + ': ' + escapeHtml(v) + '</span>').join('');
      rows.push('<div class="kv-row"><div class="kv-k">img_num</div><div class="kv-v">' + s + '</div></div>');
    }
    return ''
      + '<div class="card">'
      + '<div class="card-header"><div class="card-title">' + whichLabel + '</div><span class="card-badge ' + badgeClass + '">' + (badgeClass === 'badge-poi' ? 'POI' : 'CORR POI') + '</span></div>'
      + '<div class="kv-list">' + rows.filter(Boolean).join('') + '</div>'
      + '</div>';
  }

  function resolveImgUrl(item) {
    // item 可能是字符串，也可能是 {origin_img_url, tos_img_url} 的 dict
    if (!item) return '';
    if (typeof item === 'string') return item;
    // dict: 优先 origin_img_url，为空时 fallback 到 tos_img_url
    return (item.origin_img_url && item.origin_img_url.trim()) ? item.origin_img_url : (item.tos_img_url || '');
  }

  function renderGallery(urls, opts) {
    opts = opts || {};
    if (!urls || !urls.length) return '<div class="no-imgs">无图片</div>';
    const cls = opts.wide ? 'gallery wide' : 'gallery';
    return '<div class="' + cls + '">' + urls.map((item, i) => {
      const u = resolveImgUrl(item);
      if (!u) return '';
      const key = opts.key ? ' key' : '';
      return '<div class="thumb' + key + '" onclick="openLightbox(this)" data-url="' + escapeHtml(u) + '">'
           + '<span class="idx">' + (i + 1) + '</span>'
           + '<img loading="lazy" data-src="' + escapeHtml(u) + '" alt="" onerror="handleImgError(this)" />'
           + '</div>';
    }).filter(Boolean).join('') + '</div>';
  }

  function googleCard(g) {
    if (!g || (typeof g === 'object' && !Object.keys(g).length)) return '';
    if (typeof g === 'string') {
      // may be a string
      return '<div class="strip-card"><div class="section-title"><span class="dot"></span>Google 信息</div><div class="kv-list"><div class="kv-row"><div class="kv-k">value</div><div class="kv-v">' + escapeHtml(g) + '</div></div></div></div>';
    }
    const rows = [];
    rows.push(kvRow('name', g.name));
    rows.push(kvRow('address', g.address));
    if (g.latitude !== undefined && g.longitude !== undefined)
      rows.push('<div class="kv-row"><div class="kv-k">lat / lng</div><div class="kv-v mono">' + escapeHtml(g.latitude) + ' , ' + escapeHtml(g.longitude) + '</div></div>');
    rows.push('<div class="kv-row"><div class="kv-k">google_types</div><div class="kv-v">' + typeTag(g.google_types || g.type_str || '-') + '</div></div>');
    rows.push(kvRow('businessStatus', g.businessStatus, true));
    if (g.third_id_list && g.third_id_list.length) {
      rows.push('<div class="kv-row"><div class="kv-k">place_id</div><div class="kv-v mono">' + escapeHtml(g.third_id_list.join(', ')) + '</div></div>');
    }
    let imgsHtml = '';
    if (g.images && g.images.length) {
      imgsHtml = '<div class="section-title" style="margin-top:14px;"><span class="dot"></span>Google 图片 <span class="count">· ' + g.images.length + '</span></div>' + renderGallery(g.images);
    }
    return ''
      + '<div class="strip-card">'
      + '<div class="card-header" style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--card-border);"><div class="card-title">🌍 Google POI 信息</div><span class="card-badge badge-google">GOOGLE</span></div>'
      + '<div class="kv-list">' + rows.filter(Boolean).join('') + '</div>'
      + imgsHtml
      + '</div>';
  }

  function renderSourceImages(sourceMap) {
    if (!sourceMap || !Object.keys(sourceMap).length) return '<div class="no-imgs">无全部图片</div>';
    let html = '';
    for (const [src, urls] of Object.entries(sourceMap)) {
      if (!urls || !urls.length) continue;
      html += '<div style="margin-top:12px;font-size:12px;color:var(--text-secondary);font-family:\'JetBrains Mono\',ui-monospace,monospace;">[' + escapeHtml(src) + '] · ' + urls.length + ' 张</div>';
      html += renderGallery(urls);
    }
    return html || '<div class="no-imgs">无全部图片</div>';
  }

  function renderItem(id) {
    const d = DATA[id];
    if (!d) return renderNotFound(id);

    const html = [];
    html.push(metaBar(d));

    html.push('<div class="comparison">');
    // POI card + images
    html.push('<div>');
    html.push(poiCard(d.poi, '📍 POI 基础信息', 'badge-poi'));
    
    // Key Images from images field
    html.push('<div class="section-title" style="margin-top:18px;"><span class="dot"></span>POI 关键图片 (images) <span class="count">· ' + ((d.poi && d.poi.images) ? d.poi.images.length : 0) + '</span></div>');
    html.push(renderGallery(d.poi && d.poi.images, { key: true }));
    
    // All Images from source_img_lists_map
    html.push('<div class="section-title" style="margin-top:18px;color:var(--text-primary);"><span class="dot"></span>POI 全部图片 (source_img_lists_map)</div>');
    html.push(renderSourceImages(d.poi && d.poi.source_img_lists_map));
    
    html.push('</div>');

    // CORR POI card + images
    html.push('<div>');
    html.push(poiCard(d.corr_poi, '📌 CORR POI 基础信息', 'badge-corr'));
    
    // Key Images from images field
    html.push('<div class="section-title" style="margin-top:18px;"><span class="dot"></span>CORR POI 关键图片 (images) <span class="count">· ' + ((d.corr_poi && d.corr_poi.images) ? d.corr_poi.images.length : 0) + '</span></div>');
    html.push(renderGallery(d.corr_poi && d.corr_poi.images, { key: true }));
    
    // All Images from source_img_lists_map
    html.push('<div class="section-title" style="margin-top:18px;color:var(--text-primary);"><span class="dot"></span>CORR POI 全部图片 (source_img_lists_map)</div>');
    html.push(renderSourceImages(d.corr_poi && d.corr_poi.source_img_lists_map));
    
    html.push('</div>');
    html.push('</div>');

    // Key images
    if (d.key_imgs && d.key_imgs.length) {
      html.push('<div class="strip-card key">');
      html.push('<div class="section-title"><span class="dot"></span>⭐ 关键图片 (Annotator Key Images) <span class="count">· ' + d.key_imgs.length + '</span></div>');
      html.push(renderGallery(d.key_imgs, { wide: true, key: true }));
      html.push('</div>');
    }

    // Same image list
    if (d.same_img_list && d.same_img_list.length) {
      html.push('<div class="strip-card same">');
      html.push('<div class="section-title"><span class="dot"></span>🎯 Same Image List (POI ↔ CORR POI 相同图片) <span class="count">· ' + d.same_img_list.length + '</span></div>');
      html.push(renderGallery(d.same_img_list, { wide: true }));
      html.push('</div>');
    }

    // Google same image list
    if (d.google_same_img_list && d.google_same_img_list.length) {
      html.push('<div class="strip-card google-same">');
      html.push('<div class="section-title"><span class="dot"></span>🌐 Google Same Image List <span class="count">· ' + d.google_same_img_list.length + '</span></div>');
      html.push(renderGallery(d.google_same_img_list, { wide: true }));
      html.push('</div>');
    }

    // Google
    const g = googleCard(d.google);
    if (g) html.push(g);

    // Audit
    if (d.audited_desc) {
      html.push('<div class="strip-card"><div class="section-title"><span class="dot"></span>📝 审核描述</div><div style="color:var(--text-secondary);font-size:13px;white-space:pre-wrap;">' + escapeHtml(d.audited_desc) + '</div></div>');
    }

    document.getElementById('result').innerHTML = html.join('');

    // Lazy load images with IntersectionObserver
    const imgs = document.querySelectorAll('img[data-src]');
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const img = e.target;
            img.src = img.dataset.src;
            img.onload = () => img.classList.add('loaded');
            io.unobserve(img);
          }
        });
      }, { rootMargin: '200px' });
      imgs.forEach(img => io.observe(img));
    } else {
      imgs.forEach(img => { img.src = img.dataset.src; img.onload = () => img.classList.add('loaded'); });
    }
  }

  // ---------------- Lightbox ----------------
  window.handleImgError = function (img) {
    try {
      const parent = img.parentNode;
      if (!parent) return;
      parent.classList.add('error');
      // Clear the parent's content, keep only a text label
      parent.innerHTML = '<span style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px;">图片加载失败<br/><span style="font-size:9px;opacity:0.6;">(可能因跨域被浏览器阻止)</span></span>';
    } catch (e) { /* ignore */ }
  };
  window.openLightbox = function (el) {
    const url = el.dataset.url;
    if (!url) return;
    const lb = document.getElementById('lightbox');
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-url').textContent = url;
    lb.classList.add('show');
  };
  window.closeLightbox = function (e) {
    if (e && e.target && e.target.tagName === 'IMG' && e.target.id === 'lightbox-img') return;
    document.getElementById('lightbox').classList.remove('show');
    document.getElementById('lightbox-img').src = '';
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  // ---------------- Hash routing ----------------
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && DATA[h]) { inputEl.value = h; renderItem(h); }
  }
  window.addEventListener('hashchange', fromHash);
  // fromHash() is now called after loadData()
  loadData();
})();
</script>
</body>
</html>
